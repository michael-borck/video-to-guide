[project]
name = "videotoguide"
version = "0.1.0"
description = "Turn screen recordings into step-by-step guides."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "jinja2>=3.1",
    "pydantic>=2.9",
    "scenedetect>=0.6.5",
    "opencv-python-headless>=4.11,<5",
    "pillow>=11",
    "imagehash>=4.3",
]

[project.scripts]
vtg = "videotoguide.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/videotoguide"]
