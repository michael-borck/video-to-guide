name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      # Don't cancel sibling platform builds if one fails — debugging is
      # easier when all platforms report their result.
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            triple: aarch64-apple-darwin
          - os: macos-13
            triple: x86_64-apple-darwin
          - os: ubuntu-22.04
            triple: x86_64-unknown-linux-gnu
          - os: windows-latest
            triple: x86_64-pc-windows-msvc

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Sync Python dependencies
        run: uv sync --group package

      - name: Build frontend
        run: |
          npm ci
          npm run build
        working-directory: frontend

      # Re-verify before packaging; a tag pushed any other way than a tested
      # commit would otherwise ship untested code.
      - name: Backend tests
        run: uv run python -m unittest discover -s tests

      - name: Frontend tests
        run: npm test
        working-directory: frontend

      - name: Build sidecar server (PyInstaller)
        run: uv run pyinstaller --noconfirm vtg-server.spec

      - name: Stage sidecar as Tauri resource
        shell: bash
        run: |
          mkdir -p src-tauri/sidecar
          cp -r dist/vtg-server src-tauri/sidecar/vtg-server

      - name: Sync tauri.conf.json version with tag
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          uv run python - "$TAG" <<'EOF'
          import json, sys
          from pathlib import Path
          path = Path("src-tauri/tauri.conf.json")
          conf = json.loads(path.read_text(encoding="utf-8"))
          conf["version"] = sys.argv[1]
          path.write_text(json.dumps(conf, indent=2) + "\n", encoding="utf-8")
          print(f"tauri version -> {sys.argv[1]}")
          EOF

      - name: Build Tauri app and upload to release draft
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'video-to-guide v__VERSION__'
          releaseBody: 'Download the installer for your platform. PDF export needs Google Chrome (or Chromium/Edge) installed.'
          releaseDraft: true
          prerelease: false

      - name: Upload bundles as build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: bundles-${{ matrix.triple }}
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
          retention-days: 5
          if-no-files-found: ignore

  publish:
    # Promote the draft release to published "Latest" only after every
    # matrix build has succeeded, so a partial release never ships.
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME#refs/tags/}"
          echo "Publishing release $TAG"
          gh release edit "$TAG" \
            --draft=false \
            --latest \
            --repo "${{ github.repository }}"
